<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background with gradient -->
  <rect width="64" height="64" rx="16" fill="url(#bg-gradient)"/>
  
  <!-- Skeleton elements -->
  <!-- Avatar -->
  <circle cx="20" cy="24" r="10" fill="white" fill-opacity="0.9"/>
  <!-- Lines -->
  <rect x="36" y="18" width="18" height="5" rx="2.5" fill="white" fill-opacity="0.9"/>
  <rect x="36" y="27" width="12" height="5" rx="2.5" fill="white" fill-opacity="0.6"/>
  <!-- Content block -->
  <rect x="10" y="42" width="44" height="5" rx="2.5" fill="white" fill-opacity="0.4"/>
  <rect x="10" y="51" width="30" height="5" rx="2.5" fill="white" fill-opacity="0.4"/>

  <defs>
    <linearGradient id="bg-gradient" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
</svg>
